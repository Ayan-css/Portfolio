<svg xmlns="http://www.w3.org/2000/svg" width="880" height="286" viewBox="0 0 880 286" role="img" aria-label="AyanOS boot sequence: whoami, ansari mohd ayan nasiruddin, full-stack developer">
  <style>
    /* Self-contained: no web fonts, no external refs — an SVG loaded as an
       image can't fetch anything, so everything here has to already be here. */
    text { font-family: ui-monospace, "JetBrains Mono", "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .t   { font-size: 13px; }
    .sm  { font-size: 11.5px; }
    .accent { fill: #e8a33d; }
    .dim    { fill: #9a9aa4; }
    .faint  { fill: #62626c; }
    .caret  { fill: #e8a33d; animation: blink 1.05s step-end infinite; }
    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
  </style>

  <rect x="0.5" y="0.5" width="879" height="285" rx="10" fill="#0c0c0d" stroke="#2a2a2e"/>
  <path d="M0 10a10 10 0 0 1 10-10h860a10 10 0 0 1 10 10v26H0z" fill="#141416"/>
  <path d="M0 36h880" stroke="#2a2a2e"/>
  <circle cx="20" cy="18" r="4" fill="#e8a33d"/>
  <text class="sm faint" x="34" y="22.5">ayan@ayanos: ~</text>

  <text class="t dim"    x="26" y="72">AyanOS 1.0.0 — boot</text>
  <text class="t accent" x="26" y="98">$ whoami</text>
  <text class="t dim"    x="26" y="124">ansari mohd ayan nasiruddin · full-stack developer</text>
  <text class="t accent" x="26" y="150">$ loading skills.json...</text>
  <text class="t dim"    x="26" y="176">ok — 6 categories, 0 proficiency bars</text>
  <text class="t accent" x="26" y="202">$ mounting projects/...</text>
  <text class="t dim"    x="26" y="228">ok — PrintOK.app + Porejects/ (6)</text>
  <text class="t accent" x="26" y="254">$ startx<tspan class="caret">▊</tspan></text>
</svg>
