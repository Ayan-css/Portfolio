<svg xmlns="http://www.w3.org/2000/svg" width="880" height="252" viewBox="0 0 880 252" role="img" aria-label="System info: full-stack developer, Mumbai Suburban India, BSc IT at AIKTC third semester, flagship PrintOK">
  <style>
    text { font-family: ui-monospace, "JetBrains Mono", "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .t { font-size: 12.5px; }
    .k { fill: #62626c; font-size: 12.5px; }
    .v { fill: #9a9aa4; font-size: 12.5px; }
