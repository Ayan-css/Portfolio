    <rect x="26" y="26" width="66" height="44" rx="6" fill="#0c0c0d" stroke="#3a3a40"/>
    <text class="accent" x="59" y="55" text-anchor="middle" font-size="20">&gt;_</text>
    <path d="M22 84h74" stroke="#2a2a2e"/>
    <text x="59" y="104" text-anchor="middle" font-size="12" fill="#62626c">AyanOS</text>
  </g>

  <g transform="translate(206 0)">
    <text class="t" x="0" y="46"><tspan class="accent">ayan</tspan><tspan fill="#62626c">@</tspan><tspan class="accent">ayanos</tspan></text>
    <path d="M0 56h420" stroke="#2a2a2e"/>

    <text class="k" x="0"  y="82">user</text>       <text class="v" x="110" y="82">ayan</text>
    <text class="k" x="0"  y="104">role</text>      <text class="v" x="110" y="104">full-stack developer</text>
