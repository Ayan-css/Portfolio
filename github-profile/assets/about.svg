    <text class="k" x="0"  y="148">education</text> <text class="v" x="110" y="148">BSc IT · AIKTC · 3rd semester</text>
    <text class="k" x="0"  y="170">gpa</text>       <text class="v" x="110" y="170">9.5 (sem 1) · 9.65 (sem 2)</text>
